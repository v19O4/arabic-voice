<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>صوتي العربي</title>

    <script src="https://js.puter.com/v2/"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f1ea;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            text-align: center;
            color: #5b3a20;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            font-size: 18px;
            line-height: 1.8;
            border: 1px solid #ccc;
            border-radius: 12px;
            resize: vertical;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #5b3a20;
            color: white;
            font-size: 18px;
        }

        button:disabled {
            background: #999;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎙️ صوتي العربي</h1>

    <p>
        حوّل النص العربي إلى صوت.
    </p>

    <textarea id="text">السلام عليكم ورحمة الله وبركاته. هذا اختبار للصوت العربي.</textarea>

    <label for="voice">اختر الصوت:</label>

    <select id="voice">

        <option value="default">
            الصوت الافتراضي
        </option>

        <option value="21m00Tcm4TlvDq8ikWAM">
            Rachel - ElevenLabs
        </option>

    </select>

    <button id="convert">
        🔊 تحويل إلى صوت
    </button>

    <div id="status"></div>

    <audio id="player" controls></audio>

</div>


<script>

const button = document.getElementById("convert");
const text = document.getElementById("text");
const voice = document.getElementById("voice");
const status = document.getElementById("status");
const player = document.getElementById("player");


button.onclick = async function () {

    const content = text.value.trim();

    if (!content) {
        status.textContent = "⚠️ اكتب النص أولًا.";
        return;
    }

    button.disabled = true;
    status.textContent = "⏳ جارٍ إنشاء الصوت...";

    try {

        let audio;

        if (voice.value === "default") {

            audio = await puter.ai.txt2speech(content);

        } else {

            audio = await puter.ai.txt2speech(content, {

                provider: "elevenlabs",

                voice: voice.value,

                model: "eleven_multilingual_v2"

            });

        }

        player.src = audio.src;

        status.textContent = "✅ تم إنشاء الصوت بنجاح.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ حدث خطأ:\n" +
            (error.message || error);

    } finally {

        button.disabled = false;

    }

};

</script>

</body>
</html>
