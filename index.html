<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>وَلَعَلَّكُمْ تَشْكُرُونَ | حسام فودة</title>

    <!-- Puter -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: #06130f;
        }

        body {
            min-height: 100vh;
            font-family: "Cairo", Arial, sans-serif;
            color: #f8f3e6;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(218, 181, 101, 0.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(13, 91, 64, 0.28),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #071612 0%,
                    #0a1d17 45%,
                    #04110d 100%
                );

            background-attachment: fixed;

            padding: 30px 15px;

            display: block;
        }


        /* =========================
           زخارف الخلفية
        ========================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: 0.25;

            background-image:
                linear-gradient(
                    135deg,
                    rgba(218,181,101,0.035) 25%,
                    transparent 25%
                ),
                linear-gradient(
                    315deg,
                    rgba(218,181,101,0.025) 25%,
                    transparent 25%
                );

            background-size: 80px 80px;

            z-index: 0;
        }


        /* =========================
           الحاوية
        ========================= */

        .container {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;

            position: relative;
            z-index: 1;
        }


        /* =========================
           البطاقة
        ========================= */

        .card {

            width: 100%;

            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 48, 38, 0.97),
                    rgba(5, 22, 16, 0.99)
                );

            border: 1px solid rgba(218,181,101,0.25);

            border-radius: 30px;

            padding: 40px;

            box-shadow:
                0 30px 90px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.04);

        }


        /* اللمعة الذهبية */

        .card::before {

            content: "";

            position: absolute;

            width: 320px;
            height: 320px;

            top: -180px;
            left: -130px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(218,181,101,0.13),
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================
           الرأس
        ========================= */

        .header {

            position: relative;

            text-align: center;

            margin-bottom: 35px;
        }


        .ornament {

            color: #d8b565;

            font-size: 20px;

            letter-spacing: 7px;

            margin-bottom: 14px;

            opacity: 0.9;
        }


        /* الاسم الرئيسي */

        h1 {

            font-family: "Reem Kufi", "Cairo", sans-serif;

            color: #f1d58b;

            font-size: clamp(32px, 7vw, 56px);

            font-weight: 600;

            line-height: 1.5;

            letter-spacing: 0;

            text-shadow:
                0 3px 20px rgba(218,181,101,0.18);

        }


        .subtitle {

            margin-top: 12px;

            color: #aebcb5;

            font-size: 15px;

            line-height: 1.8;
        }


        /* =========================
           فاصل ذهبي
        ========================= */

        .gold-line {

            width: 100%;

            height: 1px;

            margin: 25px 0 30px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(218,181,101,0.5),
                    transparent
                );
        }


        /* =========================
           العنوان
        ========================= */

        .label {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 11px;

            color: #f0d58a;

            font-size: 15px;

            font-weight: 700;
        }


        .language {

            color: #80958c;

            font-size: 12px;

            font-weight: 500;
        }


        /* =========================
           مربع النص
        ========================= */

        textarea {

            display: block;

            width: 100%;

            min-height: 240px;

            resize: vertical;

            border: 1px solid rgba(218,181,101,0.18);

            border-radius: 20px;

            padding: 20px;

            background:
                rgba(2, 12, 9, 0.72);

            color: #f8f3e6;

            font-family: "Cairo", Arial, sans-serif;

            font-size: 18px;

            line-height: 2;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        textarea::placeholder {

            color: #657870;
        }


        textarea:focus {

            border-color: rgba(218,181,101,0.65);

            background:
                rgba(2, 14, 10, 0.9);

            box-shadow:
                0 0 0 4px rgba(218,181,101,0.07),
                0 10px 35px rgba(0,0,0,0.18);
        }


        /* =========================
           العداد
        ========================= */

        .counter {

            display: flex;

            justify-content: flex-start;

            margin-top: 8px;

            color: #70827a;

            font-size: 12px;
        }


        #counter {

            color: #c6aa68;

            margin-left: 3px;
        }


        /* =========================
           الزر
        ========================= */

        .convert-button {

            width: 100%;

            border: none;

            border-radius: 18px;

            padding: 17px 20px;

            margin-top: 20px;

            cursor: pointer;

            font-family: "Cairo", sans-serif;

            font-size: 17px;

            font-weight: 800;

            color: #172019;

            background:
                linear-gradient(
                    135deg,
                    #f3dc99,
                    #d8b565
                );

            box-shadow:
                0 10px 30px rgba(218,181,101,0.13);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }


        .convert-button:hover {

            transform: translateY(-2px);

            filter: brightness(1.04);

            box-shadow:
                0 15px 40px rgba(218,181,101,0.23);
        }


        .convert-button:active {

            transform: scale(0.99);
        }


        .convert-button:disabled {

            opacity: 0.65;

            cursor: wait;

            transform: none;
        }


        /* =========================
           الحالة
        ========================= */

        #status {

            min-height: 27px;

            margin-top: 16px;

            text-align: center;

            color: #aebcb5;

            font-size: 14px;

            line-height: 1.7;
        }


        /* =========================
           مشغل الصوت
        ========================= */

        .player-box {

            margin-top: 18px;

            padding: 17px;

            border-radius: 19px;

            background:
                rgba(0,0,0,0.22);

            border:
                1px solid rgba(218,181,101,0.10);
        }


        .player-title {

            color: #9aa9a2;

            font-size: 12px;

            margin-bottom: 10px;

            text-align: center;
        }


        audio {

            width: 100%;

            display: block;
        }


        /* =========================
           التوقيع
        ========================= */

        .footer {

            margin-top: 38px;

            padding-top: 25px;

            border-top:
                1px solid rgba(218,181,101,0.12);

            text-align: center;
        }


        .signature-label {

            color: #71847b;

            font-size: 11px;

            margin-bottom: 4px;
        }


        .signature {

            font-family: "Reem Kufi", "Cairo", sans-serif;

            color: #f0d58a;

            font-size: 30px;

            font-weight: 600;

            text-shadow:
                0 3px 18px rgba(218,181,101,0.18);

        }


        .copyright {

            margin-top: 6px;

            color: #596b63;

            font-size: 10px;
        }


        /* =========================
           Loading
        ========================= */

        .loading {

            animation: pulse 1.5s infinite;
        }


        @keyframes pulse {

            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.55;
            }
        }


        /* =========================
           الجوال
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .container {
                width: 100%;
            }

            .card {

                padding: 26px 18px;

                border-radius: 23px;
            }

            .ornament {
                font-size: 17px;
                letter-spacing: 4px;
            }

            h1 {
                font-size: 31px;
            }

            .subtitle {
                font-size: 13px;
            }

            textarea {

                min-height: 210px;

                padding: 16px;

                font-size: 16px;

                line-height: 1.9;
            }

            .convert-button {

                font-size: 16px;

                padding: 16px;
            }

            .signature {

                font-size: 25px;
            }
        }


        /* =========================
           شاشات صغيرة جدًا
        ========================= */

        @media (max-width: 360px) {

            .card {
                padding: 22px 14px;
            }

            h1 {
                font-size: 27px;
            }

            textarea {
                font-size: 15px;
            }
        }

    </style>
</head>


<body>

<div class="container">

    <main class="card">

        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="ornament">
                ✦ ───── ✦
            </div>

            <h1>
                وَلَعَلَّكُمْ تَشْكُرُونَ
            </h1>

            <div class="subtitle">
                حوّل النص العربي إلى صوت بكل بساطة
            </div>

        </header>


        <div class="gold-line"></div>


        <!-- ================= CONTENT ================= -->

        <section>

            <div class="label">

                <span>
                    📝 النص
                </span>

                <span class="language">
                    العربية
                </span>

            </div>


            <textarea
                id="text"
                maxlength="2999"
                placeholder="اكتب النص الذي تريد تحويله إلى صوت..."
            >السلام عليكم ورحمة الله وبركاته. هذا اختبار لتحويل النص العربي إلى صوت.</textarea>


            <div class="counter">

                <span id="counter">0</span>
                <span> / 2999 حرف</span>

            </div>


            <button
                id="convert"
                class="convert-button"
                type="button"
            >
                🔊 تحويل النص إلى صوت
            </button>


            <div id="status"></div>


            <div class="player-box">

                <div class="player-title">
                    🎧 مشغل الصوت
                </div>

                <audio
                    id="player"
                    controls
                    preload="none"
                ></audio>

            </div>

        </section>


        <!-- ================= FOOTER ================= -->

        <footer class="footer">

            <div class="signature-label">
                تصميم وتطوير
            </div>

            <div class="signature">
                حسام فودة
            </div>

            <div class="copyright">
                © 2026 جميع الحقوق محفوظة
            </div>

        </footer>

    </main>

</div>


<script>

    /* ==========================================
       العناصر
    ========================================== */

    const text = document.getElementById("text");
    const counter = document.getElementById("counter");
    const convert = document.getElementById("convert");
    const status = document.getElementById("status");
    const player = document.getElementById("player");


    /* ==========================================
       عداد الأحرف
    ========================================== */

    function updateCounter() {

        counter.textContent = text.value.length;

    }


    text.addEventListener("input", updateCounter);

    updateCounter();


    /* ==========================================
       تحويل النص إلى صوت
    ========================================== */

    convert.addEventListener("click", async function () {

        const value = text.value.trim();


        /* التحقق من النص */

        if (!value) {

            status.textContent =
                "⚠️ اكتب نصًا أولًا.";

            text.focus();

            return;
        }


        if (value.length > 2999) {

            status.textContent =
                "⚠️ النص طويل جدًا. جرّب نصًا أقصر.";

            return;
        }


        /* حالة التحميل */

        convert.disabled = true;

        convert.classList.add("loading");

        convert.textContent =
            "⏳ جارٍ إنشاء الصوت...";

        status.textContent =
            "جاري تحويل النص إلى صوت، يرجى الانتظار...";


        try {

            /* التأكد من تحميل Puter */

            if (
                typeof puter === "undefined" ||
                !puter.ai ||
                !puter.ai.txt2speech
            ) {

                throw new Error(
                    "تعذر تحميل خدمة تحويل النص إلى صوت. أعد تحميل الصفحة."
                );

            }


            /* إنشاء الصوت */

            const audio =
                await puter.ai.txt2speech(
                    value,
                    {
                        provider: "elevenlabs",

                        model: "eleven_multilingual_v2",

                        voice: "cCYjmrGZaI86GUJ7F2Nn"
                    }
                );


            /* وضع الصوت في المشغل */

            if (!audio || !audio.src) {

                throw new Error(
                    "لم يتم الحصول على ملف صوتي."
                );

            }


            player.src = audio.src;

            player.load();


            status.textContent =
                "✅ تم إنشاء الصوت بنجاح.";


            /* تشغيل تلقائي إن سمح المتصفح */

            try {

                await player.play();

            } catch (e) {

                /* بعض المتصفحات تمنع التشغيل التلقائي */

                console.log(
                    "التشغيل التلقائي غير مسموح."
                );

            }

        }


        catch (error) {

            console.error(
                "Audio Error:",
                error
            );


            status.textContent =
                "❌ حدث خطأ: " +
                (
                    error.message ||
                    "تعذر إنشاء الصوت."
                );

        }


        finally {

            convert.disabled = false;

            convert.classList.remove("loading");

            convert.textContent =
                "🔊 تحويل النص إلى صوت";

        }

    });

</script>

</body>

</html>
