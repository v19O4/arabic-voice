<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>وَلَعَلَّكُمْ تَشْكُرُونَ | حسام فودة</title>
<meta name="description" content="وَلَعَلَّكُمْ تَشْكُرُونَ - أداة احترافية لتحويل النص العربي إلى صوت.">

<script src="https://js.puter.com/v2/"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#06120f;
    --bg2:#0a1b16;

    --card:#0d211a;
    --card2:#102a21;

    --gold:#d8b56a;
    --gold2:#f3dc98;
    --gold3:#b98d3f;

    --text:#faf7ed;
    --muted:#aebbb5;
    --muted2:#74857e;

    --border:rgba(216,181,106,.18);
    --border2:rgba(255,255,255,.07);

    --danger:#e47b7b;
    --success:#7bd6a3;

    --shadow:0 30px 100px rgba(0,0,0,.48);
}

body.light{
    --bg:#edf2ed;
    --bg2:#dfe9e2;

    --card:#ffffff;
    --card2:#f3f7f4;

    --text:#17251f;
    --muted:#66766e;
    --muted2:#84928c;

    --border:rgba(135,101,39,.22);
    --border2:rgba(0,0,0,.08);

    background:
        radial-gradient(circle at 10% 10%,rgba(216,181,106,.22),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(33,104,78,.13),transparent 35%),
        var(--bg);
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    font-family:"Cairo",Arial,sans-serif;
    color:var(--text);

    background:
        radial-gradient(circle at 10% 10%,rgba(216,181,106,.12),transparent 28%),
        radial-gradient(circle at 90% 85%,rgba(22,111,79,.20),transparent 34%),
        linear-gradient(145deg,var(--bg),var(--bg2));

    padding:25px 14px 50px;
    transition:background .4s,color .4s;
}

/* زخارف الخلفية */

body::before,
body::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:-1;
    opacity:.22;
}

body::before{
    width:420px;
    height:420px;
    top:-180px;
    left:-150px;

    background:
        repeating-linear-gradient(
            45deg,
            transparent 0,
            transparent 18px,
            rgba(216,181,106,.10) 19px,
            transparent 20px
        );

    transform:rotate(15deg);
}

body::after{
    width:500px;
    height:500px;
    bottom:-250px;
    right:-180px;

    border:1px solid rgba(216,181,106,.12);
    transform:rotate(45deg);
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}

.card{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            color-mix(in srgb,var(--card2) 94%,transparent),
            color-mix(in srgb,var(--card) 98%,transparent)
        );

    border:1px solid var(--border);
    border-radius:32px;

    padding:42px;

    box-shadow:
        var(--shadow),
        inset 0 1px rgba(255,255,255,.05);

    backdrop-filter:blur(18px);
}

.card::before{
    content:"";
    position:absolute;

    width:320px;
    height:320px;

    border-radius:50%;

    background:radial-gradient(
        circle,
        rgba(216,181,106,.11),
        transparent 68%
    );

    top:-190px;
    left:-100px;

    pointer-events:none;
}

.card::after{
    content:"";
    position:absolute;

    width:220px;
    height:220px;

    border:1px solid rgba(216,181,106,.08);

    transform:rotate(45deg);

    bottom:-150px;
    right:-100px;

    pointer-events:none;
}

/* Header */

.header{
    text-align:center;
    position:relative;
    margin-bottom:34px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:7px 14px;

    border:1px solid var(--border);
    border-radius:999px;

    color:var(--gold2);

    background:rgba(216,181,106,.06);

    font-size:12px;
    margin-bottom:18px;
}

.ornament{
    color:var(--gold);
    font-size:20px;
    letter-spacing:7px;
    margin-bottom:12px;
}

h1{
    margin:0;

    font-family:"Noto Kufi Arabic","Reem Kufi",sans-serif;

    font-size:clamp(31px,7vw,58px);

    line-height:1.7;

    font-weight:700;

    color:var(--gold2);

    text-shadow:
        0 3px 30px rgba(216,181,106,.18);
}

.subtitle{
    margin-top:9px;
    color:var(--muted);
    font-size:15px;
}

.divider{
    width:110px;
    height:2px;

    margin:22px auto 0;

    background:linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
    );
}

/* Labels */

.label{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:10px;

    color:var(--gold2);

    font-weight:700;
}

.language{
    font-size:12px;
    color:var(--muted);
    font-weight:500;
}

/* Editor */

.editor{
    position:relative;
}

textarea{
    width:100%;
    min-height:260px;

    resize:vertical;

    border:1px solid var(--border);
    border-radius:21px;

    padding:20px 20px 54px;

    background:rgba(2,12,9,.55);

    color:var(--text);

    font-family:"Cairo",sans-serif;
    font-size:18px;
    line-height:2;

    outline:none;

    transition:.25s;
}

body.light textarea{
    background:#f8fbf9;
}

textarea::placeholder{
    color:var(--muted2);
}

textarea:focus{
    border-color:var(--gold);

    box-shadow:
        0 0 0 4px rgba(216,181,106,.08),
        0 10px 35px rgba(0,0,0,.12);
}

.editor-bottom{
    position:absolute;

    bottom:12px;
    right:14px;
    left:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    color:var(--muted2);

    font-size:11px;
}

.counter{
    direction:rtl;
}

.editor-tools{
    display:flex;
    gap:6px;
}

.small-btn{
    width:auto;
    margin:0;

    padding:5px 9px;

    border-radius:9px;

    background:rgba(216,181,106,.07);

    color:var(--gold2);

    border:1px solid var(--border);

    font-size:11px;
    font-weight:600;

    box-shadow:none;
}

.small-btn:hover{
    transform:none;
    box-shadow:none;
    background:rgba(216,181,106,.13);
}

/* Presets */

.section-title{
    margin-top:27px;
    margin-bottom:12px;

    color:var(--gold2);
    font-size:14px;
    font-weight:700;
}

.presets{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.preset{
    border:1px solid var(--border);
    border-radius:13px;

    padding:10px 7px;

    background:rgba(216,181,106,.04);

    color:var(--muted);

    font-family:"Cairo";
    font-size:12px;

    cursor:pointer;

    transition:.2s;
}

.preset:hover{
    color:var(--gold2);
    border-color:var(--gold);
    background:rgba(216,181,106,.08);
}

/* Settings */

.settings{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;

    margin-top:20px;
}

.setting{
    padding:15px;

    border:1px solid var(--border);

    border-radius:17px;

    background:rgba(0,0,0,.12);
}

.setting label{
    display:flex;
    justify-content:space-between;

    color:var(--muted);

    font-size:12px;
    margin-bottom:8px;
}

.setting strong{
    color:var(--gold2);
}

select,
input[type="range"]{
    width:100%;
}

select{
    appearance:none;

    padding:10px 12px;

    border-radius:11px;

    border:1px solid var(--border);

    background:var(--card2);
    color:var(--text);

    font-family:"Cairo";

    outline:none;
}

input[type="range"]{
    accent-color:var(--gold);
    cursor:pointer;
}

/* Main button */

#convert{
    width:100%;

    border:0;

    border-radius:18px;

    padding:17px;

    margin-top:22px;

    cursor:pointer;

    font-family:"Cairo";
    font-size:18px;
    font-weight:800;

    color:#182019;

    background:
        linear-gradient(
            135deg,
            var(--gold2),
            var(--gold)
        );

    box-shadow:
        0 13px 35px rgba(216,181,106,.18);

    transition:.25s;
}

#convert:hover{
    transform:translateY(-2px);

    box-shadow:
        0 18px 45px rgba(216,181,106,.28);
}

#convert:disabled{
    opacity:.7;
    cursor:wait;
    transform:none;
}

/* Status */

.status{
    min-height:25px;

    margin-top:14px;

    text-align:center;

    color:var(--muted);

    font-size:13px;
}

/* Audio */

.audio-card{
    display:none;

    margin-top:20px;

    padding:20px;

    border-radius:21px;

    border:1px solid var(--border);

    background:
        linear-gradient(
            145deg,
            rgba(216,181,106,.06),
            rgba(0,0,0,.16)
        );
}

.audio-card.show{
    display:block;
    animation:fadeUp .4s ease;
}

.audio-title{
    display:flex;
    align-items:center;
    gap:9px;

    color:var(--gold2);
    font-weight:700;
    margin-bottom:14px;
}

.audio-controls{
    display:flex;
    gap:10px;
}

.audio-btn{
    flex:1;

    border:1px solid var(--border);

    border-radius:12px;

    padding:10px;

    background:rgba(216,181,106,.06);

    color:var(--gold2);

    font-family:"Cairo";
    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.audio-btn:hover{
    background:rgba(216,181,106,.13);
}

audio{
    width:100%;
    margin-bottom:10px;
}

/* History */

.history{
    display:none;
    margin-top:28px;
}

.history.show{
    display:block;
}

.history-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:12px;
}

.history-title{
    color:var(--gold2);
    font-weight:700;
}

.clear-history{
    border:0;
    background:none;
    color:var(--danger);
    cursor:pointer;
    font-family:"Cairo";
    font-size:11px;
}

.history-item{
    display:flex;
    align-items:center;
    gap:12px;

    padding:12px;

    margin-bottom:8px;

    border:1px solid var(--border);

    border-radius:14px;

    background:rgba(0,0,0,.10);
}

.history-icon{
    width:36px;
    height:36px;

    display:grid;
    place-items:center;

    border-radius:10px;

    background:rgba(216,181,106,.09);

    color:var(--gold2);
}

.history-text{
    flex:1;

    min-width:0;
}

.history-text strong{
    display:block;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    color:var(--text);

    font-size:12px;
}

.history-text span{
    color:var(--muted2);
    font-size:10px;
}

.history-play{
    width:auto;

    margin:0;

    padding:7px 10px;

    font-size:11px;

    background:transparent;

    color:var(--gold2);

    border:1px solid var(--border);

    box-shadow:none;
}

/* Footer */

.footer{
    margin-top:36px;

    padding-top:25px;

    border-top:1px solid var(--border);

    text-align:center;
}

.footer-symbol{
    color:var(--gold);
    margin-bottom:12px;
}

.signature-label{
    color:var(--muted2);
    font-size:11px;
}

.signature{
    margin-top:3px;

    font-family:"Noto Kufi Arabic","Reem Kufi",sans-serif;

    color:var(--gold2);

    font-size:28px;
    font-weight:700;

    text-shadow:
        0 3px 20px rgba(216,181,106,.18);
}

.copyright{
    margin-top:7px;

    color:var(--muted2);

    font-size:10px;
}

/* Top
