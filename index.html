<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>صوتي العربي</title>

    <script src="https://js.puter.com/v2/"></script>

    <style>
        body {
            font-family: Arial;
            background: #f5f1e8;
            padding: 20px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        textarea {
            width: 100%;
            height: 220px;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            line-height: 1.8;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #654321;
            color: white;
            border: 0;
            border-radius: 10px;
            font-size: 18px;
        }

        #status {
            margin-top: 15px;
            text-align: center;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🎙️ صوتي العربي</h1>

    <textarea id="text">السلام عليكم ورحمة الله وبركاته. هذا اختبار لتحويل النص العربي إلى صوت.</textarea>

    <button id="convert">
        🔊 تحويل إلى صوت
    </button>

    <div id="status"></div>

    <audio id="player" controls></audio>

</div>

<script>

document.getElementById("convert").onclick = async function () {

    const text = document.getElementById("text").value.trim();
    const status = document.getElementById("status");
    const player = document.getElementById("player");

    if (!text) {
        status.textContent = "اكتب نصًا أولًا";
        return;
    }

    if (text.length >= 3000) {
        status.textContent = "النص طويل جدًا. جرّب نصًا أقصر.";
        return;
    }

    status.textContent = "⏳ جارٍ إنشاء الصوت...";

    try {

        const audio = await puter.ai.txt2speech(text, {
            provider: "elevenlabs",
            model: "eleven_multilingual_v2",
            voice: "21m00Tcm4TlvDq8ikWAM"
        });

        player.src = audio.src;

        status.textContent = "✅ تم إنشاء الصوت. اضغط تشغيل.";

        console.log("Audio:", audio);

    } catch (error) {

        console.error("ERROR:", error);

        status.textContent =
            "❌ الخطأ: " +
            (error.message || String(error));

    }
};

</script>

</body>
</html>
