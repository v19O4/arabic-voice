<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>وَلَعَلَّكُمْ تَشْكُرُونَ | حسام فودة</title>

    <script src="https://js.puter.com/v2/"></script>

    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0b1714;
            --card: #10211c;
            --card-light: #142a23;
            --gold: #d8b56a;
            --gold-light: #f1d894;
            --text: #f7f3e8;
            --muted: #aebcb5;
            --border: rgba(216,181,106,.20);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Cairo", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 10%, rgba(216,181,106,.12), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(33,104,78,.25), transparent 35%),
                var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 820px;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, rgba(20,42,35,.97), rgba(8,22,18,.98));
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 38px;
            box-shadow:
                0 25px 80px rgba(0,0,0,.45),
                inset 0 1px rgba(255,255,255,.04);
        }

        .card::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: rgba(216,181,106,.06);
            top: -130px;
            left: -100px;
        }

        .header {
            position: relative;
            text-align: center;
            margin-bottom: 30px;
        }

        .ornament {
            color: var(--gold);
            font-size: 22px;
            letter-spacing: 8px;
            margin-bottom: 12px;
        }

        h1 {
            margin: 0;
            color: var(--gold-light);
            font-family: "Reem Kufi", sans-serif;
            font-size: clamp(30px, 6vw, 52px);
            font-weight: 600;
            line-height: 1.5;
            text-shadow: 0 4px 25px rgba(216,181,106,.15);
        }

        .subtitle {
            margin-top: 10px;
            color: var(--muted);
            font-size: 15px;
        }

        .label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            color: var(--gold-light);
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 230px;
            resize: vertical;
            border: 1px solid rgba(216,181,106,.18);
            border-radius: 18px;
            padding: 18px;
            background: rgba(4,14,11,.65);
            color: var(--text);
            font-family: "Cairo", sans-serif;
            font-size: 18px;
            line-height: 2;
            outline: none;
            transition: .25s;
        }

        textarea::placeholder {
            color: #71817a;
        }

        textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(216,181,106,.08);
        }

        .counter {
            text-align: left;
            margin-top: 7px;
            color: #74837d;
            font-size: 12px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 16px;
            padding: 16px;
            margin-top: 18px;
            cursor: pointer;
            font-family: "Cairo", sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #172019;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            box-shadow: 0 10px 30px rgba(216,181,106,.15);
            transition: transform .2s, box-shadow .2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(216,181,106,.25);
        }

        button:active {
            transform: scale(.99);
        }

        button:disabled {
            opacity: .65;
            cursor: wait;
            transform: none;
        }

        #status {
            min-height: 25px;
            margin-top: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .player-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 18px;
            background: rgba(0,0,0,.20);
            border: 1px solid rgba(216,181,106,.10);
        }

        audio {
            width: 100%;
        }

        .footer {
            margin-top: 32px;
            padding-top: 22px;
            border-top: 1px solid rgba(216,181,106,.12);
            text-align: center;
        }

        .signature-label {
            color: #7f9189;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .signature {
            font-family: "Reem Kufi", sans-serif;
            color: var(--gold-light);
            font-size: 27px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 15px rgba(216,181,106,.18);
        }

        .copyright {
            margin-top: 5px;
            color: #687972;
            font-size: 11px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 25px 18px;
                border-radius: 22px;
            }

            h1 {
                font-size: 32px;
            }

            textarea {
                min-height: 200px;
                font-size: 16px;
            }

            .signature {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <main class="card">

        <header class="header">
            <div class="ornament">✦ ───── ✦</div>

            <h1>وَلَعَلَّكُمْ تَشْكُرُونَ</h1>

            <div class="subtitle">
                حوّل النص العربي إلى صوت بكل بساطة
            </div>
        </header>

        <section>

            <div class="label">
                <span>📝 النص</span>
                <span>العربية</span>
            </div>

            <textarea id="text"
                maxlength="2999"
                placeholder="اكتب النص الذي تريد تحويله إلى صوت...">السلام عليكم ورحمة الله وبركاته. هذا اختبار لتحويل النص العربي إلى صوت.</textarea>

            <div class="counter">
                <span id="counter">0</span> / 3000
            </div>

            <button id="convert">
                🔊 تحويل النص إلى صوت
            </button>

            <div id="status"></div>

            <div class="player-box">
                <audio id="player" controls></audio>
            </div>

        </section>

        <footer class="footer">

            <div class="signature-label">
                تصميم وتطوير
            </div>

            <div class="signature">
                حسام فودة
            </div>

            <div class="copyright">
                © 2026 جميع الحقوق محفوظة
            </div>

        </footer>

    </main>

</div>

<script>

const text = document.getElementById("text");
const counter = document.getElementById("counter");
const convert = document.getElementById("convert");
const status = document.getElementById("status");
const player = document.getElementById("player");

function updateCounter() {
    counter.textContent = text.value.length;
}

text.addEventListener("input", updateCounter);
updateCounter();

convert.onclick = async function () {

    const value = text.value.trim();

    if (!value) {
        status.textContent = "⚠️ اكتب نصًا أولًا";
        return;
    }

    if (value.length >= 3000) {
        status.textContent = "⚠️ النص طويل جدًا. جرّب نصًا أقصر.";
        return;
    }

    convert.disabled = true;
    convert.textContent = "⏳ جارٍ إنشاء الصوت...";
    status.textContent = "جاري تحويل النص إلى صوت...";

    try {

        const audio = await puter.ai.txt2speech(value, {
            provider: "elevenlabs",
            model: "eleven_multilingual_v2",
            voice: "cCYjmrGZaI86GUJ7F2Nn"
        });

        player.src = audio.src;

        status.textContent = "✅ تم إنشاء الصوت بنجاح. اضغط تشغيل.";

        player.play().catch(() => {});

        console.log("Audio:", audio);

    } catch (error) {

        console.error("ERROR:", error);

        status.textContent =
            "❌ حدث خطأ: " +
            (error.message || String(error));

    } finally {

        convert.disabled = false;
        convert.textContent = "🔊 تحويل النص إلى صوت";

    }
};

</script>

</body>
    </html>
