<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>صوتي العربي</title>

    <script src="https://js.puter.com/v2/"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f1ea;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
        }

        h1 {
            text-align: center;
            color: #5b3a20;
        }

        textarea {
            width: 100%;
            height: 250px;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            line-height: 1.8;
            border-radius: 12px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #5b3a20;
            color: white;
            font-size: 18px;
        }

        #status {
            text-align: center;
            margin-top: 15px;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎙️ صوتي العربي</h1>

    <p>اكتب نصًا قصيرًا للتجربة:</p>

    <textarea id="text">السلام عليكم ورحمة الله وبركاته. هذا اختبار للصوت العربي.</textarea>

    <button id="convert">
        🔊 تحويل إلى صوت
    </button>

    <div id="status"></div>

    <audio id="player" controls></audio>

</div>

<script>

const button = document.getElementById("convert");
const text = document.getElementById("text");
const status = document.getElementById("status");
const player = document.getElementById("player");

button.onclick = async function () {

    if (!text.value.trim()) {
        status.textContent = "⚠️ اكتب النص أولًا.";
        return;
    }

    button.disabled = true;
    status.textContent = "⏳ جارٍ إنشاء الصوت...";

    try {

        const audio = await puter.ai.txt2speech(
            text.value.trim()
        );

        player.src = audio.src;

        status.textContent = "✅ تم إنشاء الصوت.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ حدث خطأ: " +
            (error.message || error);

    } finally {

        button.disabled = false;

    }
};

</script>

</body>
</html>
