<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار الأصوات</title>

    <script src="https://js.puter.com/v2/"></script>
</head>

<body>

<h2>🎙️ أصوات ElevenLabs</h2>

<button id="load">
    تحميل الأصوات
</button>

<select id="voices">
    <option>اضغط تحميل الأصوات</option>
</select>

<p id="status"></p>

<script>

const button = document.getElementById("load");
const select = document.getElementById("voices");
const status = document.getElementById("status");

button.onclick = async function () {

    button.disabled = true;

    status.textContent = "⏳ جاري تحميل الأصوات...";

    try {

        const voices =
            await puter.ai.txt2speech.listVoices({
                provider: "elevenlabs"
            });

        select.innerHTML = "";

        if (!voices || voices.length === 0) {

            status.textContent = "❌ لم يتم العثور على أصوات.";

            return;
        }

        voices.forEach(function (voice) {

            const option =
                document.createElement("option");

            option.value = voice.id;

            option.textContent =
                voice.name +
                (voice.language
                    ? " - " + voice.language.code
                    : "");

            select.appendChild(option);

        });

        status.textContent =
            "✅ تم تحميل " + voices.length + " صوت.";

        console.log(voices);

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ حدث خطأ: " +
            (error.message || error);

    } finally {

        button.disabled = false;

    }

};

</script>

</body>
</html>
